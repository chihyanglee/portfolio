name: Deploy Astro (static)

on:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: "deploy"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The private submodule is never needed to build: the latest resume
          # content is already committed to src/data/. Keeping this off means no
          # deploy key for the private repo has to exist in CI.
          submodules: false

      - name: Setup tools (node, pnpm) from mise.toml
        uses: jdx/mise-action@v3

      # mise-action caches the tool installs but not the pnpm store, which
      # actions/setup-node used to handle via `cache: pnpm`.
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          PUBLIC_UMAMI_URL: ${{ secrets.PUBLIC_UMAMI_URL }}
          PUBLIC_UMAMI_WEBSITE_ID: ${{ secrets.PUBLIC_UMAMI_WEBSITE_ID }}

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust VPS host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy dist via rsync
        run: |
          rsync -az --delete \
            -e "ssh -o StrictHostKeyChecking=yes" \
            dist/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/portfolio/
